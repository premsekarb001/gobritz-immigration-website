<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E0A5" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#C1121F" />
    </linearGradient>
  </defs>

  <!-- Outer Crest Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />

  <!-- UK Union Jack Background Pattern -->
  <g opacity="0.3">
    <line x1="10" y1="10" x2="90" y2="90" stroke="#FFFFFF" stroke-width="7" />
    <line x1="90" y1="10" x2="10" y2="90" stroke="#FFFFFF" stroke-width="7" />
    <line x1="10" y1="10" x2="90" y2="90" stroke="url(#redGrad)" stroke-width="3.5" />
    <line x1="90" y1="10" x2="10" y2="90" stroke="url(#redGrad)" stroke-width="3.5" />
    <line x1="50" y1="4" x2="50" y2="96" stroke="#FFFFFF" stroke-width="10" />
    <line x1="4" y1="50" x2="96" y2="50" stroke="#FFFFFF" stroke-width="10" />
    <line x1="50" y1="4" x2="50" y2="96" stroke="url(#redGrad)" stroke-width="5" />
    <line x1="4" y1="50" x2="96" y2="50" stroke="url(#redGrad)" stroke-width="5" />
  </g>

  <!-- Tower Bridge Cable Arches -->
  <path d="M 16 72 Q 33 55 50 55 Q 67 55 84 72" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Tower Bridge Twin Towers -->
  <path d="M 26 84 L 26 58 L 31 52 L 36 58 L 36 84 Z" fill="url(#goldGrad)" />
  <path d="M 64 84 L 64 58 L 69 52 L 74 58 L 74 84 Z" fill="url(#goldGrad)" />
  <rect x="22" y="74" width="56" height="4" fill="#FFFFFF" rx="1" />

  <!-- Big Ben Tower Center Stage -->
  <rect x="44" y="28" width="12" height="46" fill="url(#goldGrad)" rx="1" />
  <circle cx="50" cy="38" r="4" fill="#FFFFFF" stroke="url(#navyGrad)" stroke-width="1.5" />
  <line x1="50" y1="38" x2="50" y2="35" stroke="#0B132B" stroke-width="1" />
  <line x1="50" y1="38" x2="52" y2="38" stroke="#0B132B" stroke-width="1" />
  <path d="M 42 28 L 50 14 L 58 28 Z" fill="url(#goldGrad)" />
  <line x1="50" y1="14" x2="50" y2="8" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="7" r="1.5" fill="#FFFFFF" />
</svg>
